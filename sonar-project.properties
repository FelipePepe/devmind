sonar.projectKey=devmind
sonar.projectName=DevMind
sonar.organization=

sonar.sources=packages/backend/src,packages/frontend/src,packages/workers/src
sonar.tests=
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.exclusions=**/dist/**,**/node_modules/**,**/.vite/**,**/*.d.ts,**/migrations/**,packages/frontend/public/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

sonar.javascript.environments=node,browser
sonar.typescript.tsconfigPaths=packages/backend/tsconfig.json,packages/frontend/tsconfig.json,packages/workers/tsconfig.json
