services:
  init:
    build:
      context: .
      dockerfile: Dockerfile.dev-base
    image: devmind-dev-base:local
    container_name: devmind-init
    working_dir: /app
    command: >-
      sh -c "corepack prepare pnpm@10.0.0 --activate &&
      PNPM_STORE_DIR=/pnpm-store pnpm install --frozen-lockfile"
    volumes:
      - .:/app
      - devmind-node-modules:/app/node_modules
      - devmind-pnpm-store:/pnpm-store
      - /mnt/nas/sources/devmind/data:/app/data
      - devmind-workspace:/app/workspace
    env_file:
      - .env
    networks:
      - devmind-net
    restart: 'no'

  backend:
    image: devmind-dev-base:local
    container_name: devmind-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack prepare pnpm@10.0.0 --activate && pnpm --filter @devmind/backend dev"
    ports:
      - "0.0.0.0:3001:3001"
    volumes:
      - .:/app
      - /mnt/nas/sources/devmind/data:/app/data
      - devmind-workspace:/app/workspace
      - devmind-node-modules:/app/node_modules
      - /mnt/nas/sources/casa-ca/ca.crt:/etc/ssl/casa-ca.crt:ro
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_PATH=/app/data/devmind.db
      - NODE_EXTRA_CA_CERTS=/etc/ssl/casa-ca.crt
    env_file:
      - .env
    networks:
      - devmind-net
    depends_on:
      init:
        condition: service_completed_successfully

  workers:
    image: devmind-dev-base:local
    container_name: devmind-workers
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack prepare pnpm@10.0.0 --activate && pnpm --filter @devmind/workers dev"
    shm_size: '256m'
    tmpfs:
      - /tmp/devmind-pw
    volumes:
      - .:/app
      - /mnt/nas/sources/devmind/data:/app/data
      - devmind-workspace:/app/workspace
      - devmind-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DB_PATH=/app/data/devmind.db
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
    env_file:
      - .env
    networks:
      - devmind-net
    depends_on:
      init:
        condition: service_completed_successfully
      backend:
        condition: service_started

  frontend:
    image: devmind-dev-base:local
    container_name: devmind-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack prepare pnpm@10.0.0 --activate && pnpm --filter @devmind/frontend dev --host 0.0.0.0"
    ports:
      - "0.0.0.0:5001:5173"
    volumes:
      - .:/app
      - devmind-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://backend:3001
    env_file:
      - .env
    networks:
      - devmind-net
    depends_on:
      init:
        condition: service_completed_successfully
      backend:
        condition: service_started

networks:
  devmind-net:
    driver: bridge

volumes:
  devmind-workspace:
    driver: local
  devmind-node-modules:
    driver: local
  devmind-pnpm-store:
    driver: local
