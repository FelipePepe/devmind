global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: devmind-backend
    static_configs:
      # 'backend:3001' when running via docker-compose full stack;
      # host gateway when running backend locally or mixed.
      - targets: ['backend:3001']
        labels:
          env: docker
      - targets: ['172.29.0.1:3001']
        labels:
          env: host
    metrics_path: /api/metrics
